name: Python Security CI & Docker Push (Performance Metrics Layer)

env:
  FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: true

on:
  push:
    branches: [ "main", "master" ]
  pull_request:
    branches: [ "main", "master" ]

jobs:
  # [1단계: 테스트 전용 가상머신]
  test:
    name: 🧪 Security & Unit Testing
    runs-on: ubuntu-latest
    steps:
    - name: Checkout code
      uses: actions/checkout@v4

    - name: Set up Python
      uses: actions/setup-python@v5
      with:
        python-version: '3.10'
        cache: 'pip'

    - name: Install dependencies
      run: |
        python -m pip install --upgrade pip
        if [ -f requirements.txt ]; then pip install -r requirements.txt; fi
        pip install pytest

    - name: Run Tests (Pytest)
      run: pytest tests/

  # [2단계: 배포 전용 가상머신] -> 테스트가 통과(needs: test)해야만 실행됨
  docker-push:
    name: 🐳 Docker Containerization & Registry Push
    runs-on: ubuntu-latest
    needs: test
    steps:
    - name: Checkout code (Need Dockerfile & Source)
      uses: actions/checkout@v4

    - name: Log in to Docker Hub
      uses: docker/login-action@v3
      with:
        username: ${{ secrets.DOCKERHUB_USERNAME }}
        password: ${{ secrets.DOCKERHUB_TOKEN }}

    - name: Set up Docker Buildx
      uses: docker/setup-buildx-action@v3

    - name: Build and push Docker image
      uses: docker/build-push-action@v5
      with:
        context: .
        push: true
        tags: ${{ secrets.DOCKERHUB_USERNAME }}/sample-python:latest
