version: 0.2

env:
  parameter-store:
    DOCKER_USERNAME: "beomseo25"
    DOCKER_PASSWORD: "/docker/password"

phases:
  install:
    runtime-versions:
      python: 3.10
    commands:
      - echo "파이썬 패키지 및 Pytest 설치 중..."
      - pip install --upgrade pip
      - if [ -f requirements.txt ]; then pip install -r requirements.txt; fi
      - pip install pytest
  pre_build:
    commands:
      - echo "테스트 코드를 실행합니다..."
      - pytest tests/ 
      - echo "테스트 통과! Docker Hub 로그인 진행 중..."
      - echo $DOCKER_PASSWORD | docker login -u $DOCKER_USERNAME --password-stdin
  build:
    commands:
      - echo "Python Docker 이미지 빌드 시작..."
      - docker build -t $DOCKER_USERNAME/Sample_python:latest .
  post_build:
    commands:
      - echo "Docker Hub에 이미지 푸시 중..."
      - docker push $DOCKER_USERNAME/Sample_python:latest
      - echo "CI 빌드 및 푸시 완료!"
